name: Deploy Foursquare App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

jobs:
  deploy-backend:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure AWS Credentials (OIDC Role or IAM Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package & Deploy Daily Sync Lambda
        run: |
          cd backend/daily-sync
          npm ci --omit=dev
          zip -r ../../daily-sync.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name foursquare-daily-sync \
            --zip-file fileb://daily-sync.zip

      - name: Package & Deploy Search API Lambda
        run: |
          cd backend/search-api
          npm ci --omit=dev
          zip -r ../../search-api.zip .
          cd ../..
          aws lambda update-function-code \
            --function-name foursquare-search-api \
            --zip-file fileb://search-api.zip

  deploy-frontend:
    name: Build & Deploy Frontend to S3/CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Frontend Dependencies & Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SEARCH_API_URL: ${{ secrets.VITE_SEARCH_API_URL }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Sync Build to S3 Bucket
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
